name: Build ChopSampler (Windows / macOS / Linux)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ChopSampler-linux
            package: ChopSampler-linux.tar.gz

          - os: macos-latest
            artifact: ChopSampler-macos
            package: ChopSampler-macos.zip

          - os: windows-latest
            artifact: ChopSampler-windows
            package: ChopSampler-windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # Linux audio dependencies
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      # Windows resource build
      - name: Prepare Windows resource build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "build.rs" -PathType Leaf)) {
            throw "build.rs is missing"
          }

          if (-not (Test-Path -LiteralPath "cupcakke.ico" -PathType Leaf)) {
            throw "cupcakke.ico is missing"
          }

          cargo clean -p ChopSampler

      # Make sure the YAML configuration exists
      - name: Verify ChopSampler.yaml
        shell: bash
        run: |
          if [ ! -f "ChopSampler.yaml" ]; then
            echo "ChopSampler.yaml is missing"
            exit 1
          fi

      # Build
      - name: Build release
        run: cargo build --release --bin ChopSampler --verbose

      # Windows
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "target/release/ChopSampler.exe" -PathType Leaf)) {
            throw "Cargo did not produce target/release/ChopSampler.exe"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "ChopSampler-windows" | Out-Null

          Copy-Item `
            -LiteralPath "target/release/ChopSampler.exe" `
            -Destination "ChopSampler-windows/ChopSampler.exe"

          Copy-Item `
            -LiteralPath "ChopSampler.yaml" `
            -Destination "ChopSampler-windows/ChopSampler.yaml"

          Compress-Archive `
            -Path "ChopSampler-windows" `
            -DestinationPath "ChopSampler-windows.zip" `
            -Force

      # macOS
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          mkdir -p ChopSampler.app/Contents/MacOS

          cp target/release/ChopSampler \
            ChopSampler.app/Contents/MacOS/ChopSampler

          cp ChopSampler.yaml \
            ChopSampler.app/Contents/MacOS/ChopSampler.yaml

          cat > ChopSampler.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>ChopSampler</string>

            <key>CFBundleIdentifier</key>
            <string>com.mlo7ghinsan.ChopSampler</string>

            <key>CFBundleName</key>
            <string>ChopSampler</string>

            <key>CFBundleDisplayName</key>
            <string>ChopSampler</string>

            <key>CFBundlePackageType</key>
            <string>APPL</string>

            <key>CFBundleShortVersionString</key>
            <string>0.0</string>

            <key>CFBundleVersion</key>
            <string>0.0</string>
          </dict>
          </plist>
          EOF

          chmod +x ChopSampler.app/Contents/MacOS/ChopSampler

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            ChopSampler.app \
            ChopSampler-macos.zip

      # Linux
      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p ChopSampler-linux

          cp target/release/ChopSampler \
            ChopSampler-linux/ChopSampler

          cp ChopSampler.yaml \
            ChopSampler-linux/ChopSampler.yaml

          cat > ChopSampler-linux/ChopSampler.desktop << 'EOF'
          [Desktop Entry]
          Name=ChopSampler
          Exec=./ChopSampler
          Type=Application
          Terminal=false
          Categories=AudioVideo;Audio;
          EOF

          chmod +x ChopSampler-linux/ChopSampler

          tar -czf \
            ChopSampler-linux.tar.gz \
            ChopSampler-linux

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error
